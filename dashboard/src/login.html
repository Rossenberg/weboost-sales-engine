<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#14161a; --muted:#6b7280; --line:#e5e7eb; --accent:#2f6bff; --err:#d93636; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1013; --card:#171a1f; --text:#eef0f3; --muted:#9aa1ab; --line:#262a31; --accent:#5b8cff; --err:#ff6b6b; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font-family:Inter, system-ui, sans-serif; padding:16px; }
  .card { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:32px 28px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; margin-bottom:6px; }
  .dot { width:32px; height:32px; border-radius:8px; object-fit:cover; display:block; }
  p.sub { color:var(--muted); margin:0 0 24px; font-size:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input { width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--text); font:inherit; }
  input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  button { margin-top:22px; width:100%; padding:12px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:600 15px Inter, sans-serif; cursor:pointer; }
  .err { color:var(--err); font-size:14px; margin:12px 0 0; }
</style>
